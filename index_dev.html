<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none}
:root{--or:#ff6600;--og:rgba(255,102,0,.12);--gr:#00c853;--re:#ff1744;--ye:#ffd600;--bl:#448aff;--ca:#00bcd4;--cag:rgba(0,188,212,.1);--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#242424;--bdr:#333;--bdr2:#2a2a2a;--txt:#ffffff;--txt2:#aaaaaa;--txt3:#666}
html,body{overflow-x:hidden;max-width:100%}body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',sans-serif;min-height:100vh;font-size:15px}
body.timer-open{overflow:hidden;position:fixed;width:100%}
.timer-ex-list{overflow-y:scroll;-webkit-overflow-scrolling:touch;max-height:50vh}
.app{max-width:480px;margin:0 auto;padding:0 0 80px}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:18px;padding-top:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bdr);flex-shrink:0;transition:all .3s}
.dot.active{background:var(--or);transform:scale(1.4)}
.dot.done{background:var(--gr)}
.bk{width:100%;background:transparent;color:var(--txt2);border:1px solid var(--bdr);border-radius:12px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;min-height:48px}
.bk:active{border-color:var(--or);color:var(--or)}
.qc{background:var(--bg2);border:0.5px solid var(--bdr2);border-radius:16px;padding:20px 16px;margin:0 4px}
.ql{font-size:11px;color:var(--or);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;font-weight:700}
.qt{font-size:19px;font-weight:600;margin-bottom:4px;line-height:1.35;color:var(--txt)}
.qs{font-size:13px;color:var(--txt2);margin-bottom:18px}
.og{display:grid;gap:9px;grid-template-columns:1fr 1fr}
.ob{background:var(--bg3);border:0.5px solid var(--bdr);border-radius:12px;padding:13px 8px;color:var(--txt);cursor:pointer;text-align:center;transition:all .15s}
.ob:active,.ob.sel{border:1.5px solid var(--or);background:var(--og);color:var(--or)}
.ob.dis{opacity:.3;pointer-events:none}
.oi{font-size:22px;display:block;margin-bottom:5px}
.on{font-size:13px;font-weight:600;display:block;color:inherit}
.od{font-size:11px;color:var(--txt3);margin-top:2px;display:block}
.ob.sel .od{color:rgba(255,102,0,.6)}
.hint{font-size:12px;color:var(--txt3);text-align:center;margin-top:12px}
.nb{width:100%;background:var(--or);color:#000;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;margin-top:18px;text-transform:uppercase;min-height:52px}
.nb:disabled{background:var(--bdr);color:var(--txt3)}
.td{font-size:64px;font-weight:900;color:var(--or);text-align:center;line-height:1;margin:14px 0 4px}
.tu{text-align:center;font-size:12px;color:var(--txt3);margin-bottom:18px;text-transform:uppercase;letter-spacing:2px}
input[type=range]{width:100%;-webkit-appearance:none;height:5px;border-radius:3px;background:var(--bdr);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--or);cursor:pointer}
.tps{display:flex;gap:6px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.tp{background:var(--bg3);border:0.5px solid var(--bdr);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--txt2);cursor:pointer;font-weight:500;min-height:36px}
.tp:active{border-color:var(--or);color:var(--or)}
.wh{text-align:center;margin-bottom:20px;padding:0 4px}
.wl{font-size:13px;color:var(--or);text-transform:uppercase;letter-spacing:3px;font-weight:700}
.wn{font-size:38px;font-weight:900;line-height:1;text-transform:uppercase;color:var(--txt);font-family:'Segoe UI',sans-serif}
.wm{display:flex;gap:7px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.wb{background:var(--bg2);border:0.5px solid var(--bdr);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--txt2)}
.wb.o{border:1px solid var(--or);color:var(--or);background:var(--og)}
.wb.b{border:1px solid var(--bl);color:var(--bl)}
.ws{background:var(--bg2);border:0.5px solid var(--bdr2);border-radius:14px;padding:18px 14px;margin:0 4px 10px}
.st{font-size:11px;color:var(--or);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:2px;font-family:'Segoe UI',sans-serif}
.stt{font-size:16px;font-weight:600;margin-bottom:12px;padding-bottom:10px;border-bottom:0.5px solid var(--bdr2);color:var(--txt);font-family:'Segoe UI',sans-serif;text-align:start}
.si{font-size:13px;color:var(--txt2);padding:7px 10px;background:var(--bg3);border-radius:7px;border-left:2px solid var(--or);margin-bottom:8px;line-height:1.55;font-family:'Segoe UI',sans-serif;text-align:justify}
.si.team{border-left-color:var(--ye)}
.si.sc{border-left-color:var(--bl)}
.rsep{padding:8px 0 2px;font-size:11px;color:var(--or);text-align:center;letter-spacing:2px;font-weight:700;text-transform:uppercase}
.er{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:0.5px solid var(--bdr2);transition:opacity .15s}
.er.drg-over{background:var(--og);border-radius:8px}
.edh{font-size:16px;color:var(--txt3);cursor:grab;flex-shrink:0;padding:0 2px;opacity:0.45;user-select:none;touch-action:none}
.edh:active{cursor:grabbing;opacity:0.9}
.er:last-child{border-bottom:none}
.en{width:26px;height:26px;border-radius:50%;background:var(--bg3);border:1px solid var(--or);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--or);flex-shrink:0;cursor:pointer;user-select:none;-webkit-user-select:none}
.en.reo-src{background:var(--or);color:#000;box-shadow:0 0 0 3px rgba(255,120,0,0.25)}
.en.reo-tgt{background:var(--bg2);border-style:dashed;animation:reo-pulse 1s infinite alternate}
@keyframes reo-pulse{from{border-color:var(--or);color:var(--or)}to{border-color:rgba(255,120,0,0.3);color:rgba(255,120,0,0.4)}}
.eb{flex:1;min-width:0;text-align:start}
.ename{font-size:14px;font-weight:500;color:var(--txt);margin-bottom:2px;font-family:'Segoe UI',sans-serif}
.edet{font-size:13px;color:var(--or);font-weight:700;font-family:'Segoe UI',sans-serif}
.ea{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.esb{background:var(--bg3);border:0.5px solid var(--bdr);border-radius:7px;padding:5px 9px;font-size:11px;color:var(--txt2);cursor:pointer;font-weight:600;min-height:30px;text-align:center}
.esb:active{border-color:var(--gr);color:var(--gr)}
.esb.re{color:var(--re);border-color:rgba(255,23,68,.3)}
.cb{display:flex;align-items:center;gap:9px;padding:9px 10px;margin:5px 0;background:var(--cag);border:0.5px solid rgba(0,188,212,.2);border-radius:10px}
.ci{font-size:16px;flex-shrink:0}
.cbb{flex:1;min-width:0;text-align:start}
.cn{font-size:14px;font-weight:700;color:var(--ca)}
.cd{font-size:11px;color:rgba(0,188,212,.7);margin-top:1px}
.ct{font-size:11px;background:rgba(0,188,212,.12);color:var(--ca);padding:2px 7px;border-radius:7px;font-weight:700;flex-shrink:0}
.csb{background:none;border:0.5px solid rgba(0,188,212,.3);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--ca);cursor:pointer;font-weight:600;flex-shrink:0;min-height:28px}
.sp{background:var(--bg3);border:0.5px solid rgba(0,200,83,.2);border-radius:10px;padding:11px;margin-top:3px;display:none}
.sp.open{display:block}
.sp.cp{border-color:rgba(0,188,212,.2)}
.sh{font-size:11px;color:var(--gr);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:7px}
.sh.ch{color:var(--ca)}
.so{display:flex;flex-direction:column;gap:5px}
.soi{background:var(--bg2);border:0.5px solid var(--bdr);border-radius:7px;padding:8px 11px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:40px}
.soi:active{border-color:var(--gr)}
.soi.co:active{border-color:var(--ca)}
.soi .sn{font-size:13px;font-weight:500;color:var(--txt)}
.soi .stag{font-size:12px;color:var(--txt3)}
.gn{width:100%;background:rgba(46,204,113,.10);border:0.5px dashed rgba(46,204,113,.4);border-radius:7px;padding:8px;font-size:12px;color:#2ECC71;cursor:pointer;font-weight:700;margin-top:7px;min-height:38px}
.ar{display:flex;gap:8px;margin:16px 4px 0;flex-wrap:wrap}
.ab{flex:1;border:none;border-radius:11px;padding:13px 6px;font-size:12px;font-weight:700;cursor:pointer;text-transform:uppercase;min-height:48px;min-width:0}
.ab.pri{background:var(--or);color:#000}
.ab.dan{background:rgba(255,23,68,.07);color:var(--re);border:0.5px solid rgba(255,23,68,.2)}
.loading{text-align:center;padding:60px 20px}
.spinner{width:48px;height:48px;border:3px solid var(--bdr);border-top-color:var(--or);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.lt{font-size:14px;color:var(--txt2);font-weight:600}
.tst{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--gr);color:#000;padding:10px 20px;border-radius:30px;font-weight:700;font-size:13px;transition:transform .3s,opacity .3s;opacity:0;z-index:999;text-align:center;max-width:85vw;pointer-events:none}
.tst.show{transform:translateX(-50%) translateY(0);opacity:1}
@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ani{animation:su .25s ease}
@media(max-width:380px){.wn{font-size:30px}.ob{padding:10px 6px}.on{font-size:12px}}
body.light{--bg:#f5f5f5;--bg2:#ffffff;--bg3:#eeeeee;--bdr:#d8d8d8;--bdr2:#e2e2e2;--txt:#111111;--txt2:#555555;--txt3:#999999;--og:rgba(255,102,0,.10);--cag:rgba(0,150,180,.08);--ye:#b8860b}
body.light input{color:#111 !important}
body.light .nb{color:#000}
body.light .spinner{border-color:#ddd;border-top-color:var(--or)}
body[dir=rtl] .cfg-btn{right:auto;left:14px}
body[dir=rtl] .wh{text-align:center;direction:ltr}
body[dir=rtl] .st{text-align:left;direction:ltr}
body[dir=rtl] .stt{text-align:left;direction:ltr}
body[dir=rtl] .er{direction:ltr}
body[dir=rtl] .cb{direction:ltr}
body[dir=rtl] .rsep{direction:ltr}
body[dir=rtl] .soi{direction:ltr}
body[dir=rtl] .cfg-row{direction:ltr}
body[dir=rtl] .ar{direction:ltr}
body[dir=rtl] .ql,body[dir=rtl] .wl,body[dir=rtl] .nb,body[dir=rtl] .ab,body[dir=rtl] .sh,body[dir=rtl] .tu{letter-spacing:0}
body[dir=rtl] .nb,body[dir=rtl] .bk,body[dir=rtl] .ab,body[dir=rtl] .ql,body[dir=rtl] .qt,body[dir=rtl] .qs,body[dir=rtl] .wl,body[dir=rtl] .on,body[dir=rtl] .od,body[dir=rtl] .tu,body[dir=rtl] .sh,body[dir=rtl] .hint,body[dir=rtl] .lt,body[dir=rtl] button,body[dir=rtl] .tnc-title,body[dir=rtl] .tnc-date,body[dir=rtl] .tnc-sec,body[dir=rtl] .tnc-p{font-family:'Almarai',sans-serif}
body[dir=rtl]{line-height:1.5}
.cfg-btn{position:fixed;top:14px;right:14px;z-index:150;background:var(--bg2);border:0.5px solid var(--bdr);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:19px;box-shadow:none}
.cfg-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6)}
.cfg-box{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-radius:18px 18px 0 0;padding:22px 20px 40px}
.cfg-title{font-size:15px;font-weight:700;color:var(--txt);margin-bottom:18px;text-align:center}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:0.5px solid var(--bdr2)}
.cfg-row:last-child{border-bottom:none}
.cfg-lbl{font-size:14px;color:var(--txt2);font-weight:600}
.cfg-seg{display:flex;background:var(--bg3);border-radius:8px;padding:2px;gap:2px}
.cfg-seg button{background:none;border:none;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--txt2)}
.cfg-seg button.on{background:var(--or);color:#fff}
.tnc-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;overflow-y:auto}
.tnc-box{max-width:480px;margin:0 auto;background:var(--bg2);min-height:100vh;padding:24px 18px 48px}
.tnc-title{font-size:18px;font-weight:800;color:var(--or);margin-bottom:4px}
.tnc-date{font-size:12px;color:var(--txt3);margin-bottom:20px}
.tnc-sec{font-size:14px;font-weight:700;color:var(--txt);margin:18px 0 6px}
.tnc-p{font-size:13px;color:var(--txt2);line-height:1.75;text-align:justify}
.wdi-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:0 0 0 6px;line-height:1;opacity:0.9;transition:opacity .15s;flex-shrink:0}
.wdi-btn:hover{opacity:1}
.wdi-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;animation:fdi .15s ease}
@keyframes fdi{from{opacity:0}to{opacity:1}}
.wdi-modal{background:var(--bg);border-radius:16px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;padding:24px 22px 22px;position:relative;box-shadow:0 12px 40px rgba(0,0,0,0.35)}
.wdi-close{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;font-size:18px;color:var(--txt3);line-height:1;padding:4px}
.wdi-type{font-size:11px;color:var(--or);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;font-family:'Segoe UI',sans-serif;direction:ltr;text-align:left}
.wdi-txt{font-size:13px;line-height:1.8;color:var(--txt);margin:0;text-align:justify}
.wdi-txt[dir=rtl]{font-family:'Almarai',sans-serif}
body[dir=rtl] .wdi-close{right:auto;left:12px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="tst" id="tst"></div>
<button class="cfg-btn" onclick="openCfg()">⚙️</button>
<div class="cfg-overlay" id="cfg-overlay" onclick="closeCfg()">
  <div class="cfg-box" onclick="event.stopPropagation()">
    <div class="cfg-title" id="cfg-title">Settings</div>
    <div class="cfg-row">
      <span class="cfg-lbl" id="cfg-lang-lbl">Language</span>
      <div class="cfg-seg">
        <button id="btn-en" class="on" onclick="setLang('en')">EN</button>
        <button id="btn-ar" onclick="setLang('ar')">AR</button>
      </div>
    </div>
    <div class="cfg-row">
      <span class="cfg-lbl" id="cfg-theme-lbl">Theme</span>
      <div class="cfg-seg">
        <button id="btn-dark" class="on" onclick="setTheme('dark')">🌑 Dark</button>
        <button id="btn-light" onclick="setTheme('light')">☀️ Light</button>
      </div>
    </div>
    <div class="cfg-row" onclick="showMyWODs()" style="cursor:pointer;user-select:none;border-top:0.5px solid var(--bdr);margin-top:4px;padding-top:14px">
      <span class="cfg-lbl" id="sw-lbl">💾 <span id="sw-title-lbl">My WODs</span></span>
      <span id="sw-badge" style="display:flex;align-items:center;gap:6px"><span id="sw-badge-num" style="background:var(--or);color:#fff;border-radius:50px;padding:2px 8px;font-size:12px;font-weight:700;min-width:20px;text-align:center">0</span><span style="color:var(--txt3);font-size:16px;font-weight:400;line-height:1">›</span></span>
    </div>
  </div>
</div>

<div class="tnc-overlay" id="tnc-overlay"></div>
<div id="edit-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200" onclick="closeEditDetail()">
  <div id="edit-sheet" style="position:absolute;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:var(--bg2);border:0.5px solid var(--bdr2);border-radius:18px 18px 0 0;padding:18px 18px 32px;transition:transform .25s ease;direction:ltr" onclick="event.stopPropagation()"></div>
</div>

var CFG={lang:'en',theme:'dark'};
function t(k){return T[CFG.lang][k]||T.en[k]||k;}
function arMin(n){n=parseInt(n)||0;if(n===1)return 'دقيقة واحدة';if(n===2)return 'دقيقتين';if(n>=3&&n<=10)return 'دقائق';return 'دقيقة';}
function bdiNums(s){if(CFG.lang!=='ar'||!s)return s;return s.replace(/(\d+(?:[:.\-]\d+)*)/g,'<bdi>$1</bdi>');}
function dispDetail(d){
  if(!d) return d;
  return d.replace(/تكرار/g,'reps').replace(/سعرة/g,'Cal').replace(/ متر/g,' m').replace(/متر/g,'m').replace(/جولات/g,'Rounds').replace(/جولة/g,'Round').replace(/دقيقة/g,'Min').replace(/المحطة/g,'Station');
}
function fixArPlural(s){if(CFG.lang!=='ar'||!s)return s;return s.replace(/(\d+)\s*(دقيقة واحدة|دقيقتان|دقيقة|دقائق)/g,function(_,n){return n+' '+arMin(parseInt(n));});}
function ti(k,v){var s=t(k);if(v)Object.keys(v).forEach(function(p){s=s.replace(new RegExp('{'+p+'}','g'),v[p]);});return s;}
function openCfg(){document.getElementById('cfg-overlay').style.display='block';_swUpdateBadge();}
function closeCfg(){
  document.getElementById('cfg-overlay').style.display='none';
  if(document.getElementById('tnc-overlay').style.display==='block'){renderTnC();return;}
  if(document.getElementById('gate-email')||document.getElementById('gate-inp')){showGate();}

  else{render();}
}
function setLang(l){
  CFG.lang=l;
  localStorage.setItem('wod_cfg',JSON.stringify(CFG));
  document.getElementById('btn-en').classList.toggle('on',l==='en');
  document.getElementById('btn-ar').classList.toggle('on',l==='ar');
  document.getElementById('cfg-title').textContent=t('s');
  document.getElementById('cfg-lang-lbl').textContent=t('language');
  document.getElementById('cfg-theme-lbl').textContent=t('theme');
  document.getElementById('btn-dark').textContent=(l==='ar'?'🌑 داكن':'🌑 Dark');
  document.getElementById('btn-light').textContent=(l==='ar'?'☀️ فاتح':'☀️ Light');
  document.body.dir=l==='ar'?'rtl':'ltr';
}
function setTheme(th){
  CFG.theme=th;
  localStorage.setItem('wod_cfg',JSON.stringify(CFG));
  document.body.classList.toggle('light',th==='light');
  document.getElementById('btn-dark').classList.toggle('on',th==='dark');
  document.getElementById('btn-light').classList.toggle('on',th==='light');
}
function loadCfg(){
  try{var c=JSON.parse(localStorage.getItem('wod_cfg')||'{}');
    if(c.lang)CFG.lang=c.lang;
    if(c.theme)CFG.theme=c.theme;
  }catch(e){}
  document.body.classList.toggle('light',CFG.theme==='light');
  document.body.dir=CFG.lang==='ar'?'rtl':'ltr';
  document.getElementById('btn-en').classList.toggle('on',CFG.lang==='en');
  document.getElementById('btn-ar').classList.toggle('on',CFG.lang==='ar');
  document.getElementById('btn-dark').classList.toggle('on',CFG.theme==='dark');
  document.getElementById('btn-light').classList.toggle('on',CFG.theme==='light');
  document.getElementById('cfg-title').textContent=t('s');
  document.getElementById('cfg-lang-lbl').textContent=t('language');
  document.getElementById('cfg-theme-lbl').textContent=t('theme');
  document.getElementById('btn-dark').textContent=(CFG.lang==='ar'?'🌑 داكن':'🌑 Dark');
  document.getElementById('btn-light').textContent=(CFG.lang==='ar'?'☀️ فاتح':'☀️ Light');
}

function _ordRepsByDifficulty(items,lv,team,limsFor,evenSnap,detailFor){
  var strs=items.filter(function(x){return x.kind==='str'&&!x.isRest&&x.ex&&x.baseRep&&['time','carry','m','dist','hold'].indexOf(x.ex.unit)<0;});

  var vals=strs.map(function(x){return x.baseRep;}).sort(function(a,b){return b-a;});

    _rftSec.infoKey='i_ygig_ft';_rftSec.infoVars={r:roundsEach,rt:roundsEach*2,cap:time};
    _rftSec.scoreKey='sc_time';_rftSec.teamKey='tm_ygig_ft';_rftSec.teamVars={n:eff};
    _rftSec.noLongForm=true;_rftSec.ygigCfg=cfg;
    if(_rftSec.items){var _sep=_rftSec.items.find(function(x){return x.kind==='sep';});if(_sep)_sep.label='── '+(roundsEach*2)+' Rounds ──';}

function _gabFit2(sec,lv,team,blockT,cfg){

  while(_g++<12&&Math.floor(_bSec/_pw())<2){

    var _strs=sec.items.filter(function(it){return it.kind==='str'&&it.baseRep&&!it.isRest;});
    if(_cd&&cfg.withCardio!==true){sec.items.splice(sec.items.indexOf(_cd),1);continue;}
    if(!cfg.exCnt&&_strs.length>2){
      var _hv=_strs.reduce(function(m,it){return(it.baseRep*getSecondsPerRep(it.ex,lv,1,false))>(m.baseRep*getSecondsPerRep(m.ex,lv,1,false))?it:m;});
      sec.items.splice(sec.items.indexOf(_hv),1);continue;
    }

    _strs.forEach(function(it){

function _gabSchemeFill(sec,lv,team,blockT,cfg,usedNames){

  // (2) إضافة حركة بقيمة من السكيم نفسه — كل شي ضمن حدود كل تمرين (جداول السبلت للتيم) وبدون أي رقم خارج السكيم

function buildDynReps(key,cfg){

  var sch=SCHEMES[key];if(!sch||!sch.dynamic)return null;

  for(var _t=0;_t<25;_t++){
    var secs=mkFn(time,lv,team,cfg);
    if(!secs||!secs[0])break;
    var fills=secs.map(function(s){return _secFillRatio(s,lv,team);}).filter(function(f){return f>0;});
    if(!fills.length){best=secs;break;}
    var worst=fills.reduce(function(m,f){return Math.max(m,Math.abs(f-1));},0);
    if(worst<bestScore){best=secs;bestScore=worst;}

    var _fixFmt=type==='ygig-amrap'?'amrap':type==='ygig-ft'?'for-time':null;
    var _randFmt=_fixFmt||(Math.random()>0.5?'amrap':'for-time');

function setLevel(l,el){S.level=l;S.wod=null;if(el)el.classList.add('sel');setTimeout(function(){S.step=1;render()},220)}
function step1(){
  app.innerHTML=dots(1)+'<div class="qc ani"><div class="ql">'+t('step2')+'</div><div class="qt">'+t('step2q')+'</div>'
  +'<div class="td" id="td">'+S.time+'</div><div class="tu">'+(CFG.lang==='ar'?arMin(S.time):t('minutes'))+'</div>'
  +'<input type="range" min="5" max="60" step="5" value="'+S.time+'" oninput="setT(this.value)">'
  +'<div class="tps">'+[10,15,20,25,30,40,45,60].map(function(v){return'<button class="tp" onclick="setTF('+v+')">'+v+'</button>'}).join('')+'</div>'
  +'<div style="display:flex;align-items:center;gap:8px;margin:12px auto 0;max-width:180px">'
  +'<input id="manual-time" type="number" min="1" max="120" placeholder="'+t('custom')+'" value="" style="width:100%;padding:8px 12px;border:1.5px solid var(--bdr);border-radius:10px;font-size:16px;font-weight:700;color:var(--txt);background:var(--bg2);text-align:center;font-family:inherit;outline:none" oninput="setTManual(this.value)" onkeydown="if(event.key===\'Enter\'){S.step=2;render()}">'
  +'<span style="font-size:13px;color:var(--txt2);white-space:nowrap;font-weight:600">'+(CFG.lang==='ar'?arMin(S.time):t('minutes'))+'</span>'
  +'</div>'
  +'<button class="nb" onclick="S.step=2;render()">'+t('next')+'</button>'
  +bkBtn('back_lv',0)+'</div>';
}
function setT(v){S.time=+v;var d=document.getElementById('td');if(d)d.textContent=v}
function setTF(v){S.time=v;var s=document.querySelector('input[type=range]');if(s)s.value=v;var m=document.getElementById('manual-time');if(m)m.value='';setT(v)}
function setTManual(v){var n=parseInt(v,10);if(n>=1&&n<=120){S.time=n;var d=document.getElementById('td');if(d)d.textContent=n;var s=document.querySelector('input[type=range]');if(s)s.value=Math.min(60,Math.max(5,n));}}
function step2(){
  app.innerHTML=dots(2)+'<div class="qc ani"><div class="ql">'+t('step3')+'</div><div class="qt" style="margin-bottom:16px">'+t('step3q')+'</div><div class="og">'
  +[[1,'🧍',t('solo')],[2,'🧍🧍',t('team2')]]
  .map(function(x){return'<button class="ob'+(S.teamSize===x[0]?' sel':'')+'" onclick="setTeam('+x[0]+',this)"><span class="oi">'+x[1]+'</span><span class="on">'+x[2]+'</span></button>'}).join('')+'</div>'
  +bkBtn('back_ti',1)+'</div>';
}
function setTeam(n,el){
  S.teamSize=n;S.wod=null;
  if(n<2){S.wodTypes=S.wodTypes.filter(function(id){var tp=TYPES.filter(function(x){return x.id===id;})[0];return!tp||!tp.teamOnly;});}
  if(el){document.querySelectorAll('.og .ob').forEach(function(b){b.classList.remove('sel')});el.classList.add('sel');}
  setTimeout(function(){S.step=3;render();},220);
}
var TYPES=[
  {id:'for-time',icon:'⏰',name:'For Time / RFT',desc:'Fastest time to finish',desc_ar:'أكمل الجولات بأسرع وقت'},
  {id:'amrap',icon:'🔄',name:'AMRAP',desc:'Max rounds in time cap',desc_ar:'أكبر عدد جولات ممكن'},
  {id:'emom',icon:'🔔',name:'EMOM',desc:'New set every minute',desc_ar:'حركة كل دقيقة'},
  {id:'chipper',icon:'🪓',name:'Chipper',desc:'One long list, once through',desc_ar:'مرة واحدة عبر كل الحركات'},
  {id:'ladder',icon:'🪜',name:'Ladder',desc:'Reps climb or drop each round',desc_ar:'تكرارات تصاعدية أو تنازلية'},
  {id:'buy-in-cashout',icon:'🎯',name:'Buy-In / Cash-Out',desc:'Cardio before / after',desc_ar:'كارديو في البداية والنهاية'},
  {id:'tabata',icon:'💥',name:'Tabata',desc:'20s work, 10s rest × 8',desc_ar:'20ث عمل / 10ث راحة × 8 جولات'},
  {id:'death-by',icon:'💀',name:'Death By',desc:'+1 rep every minute',desc_ar:'يضاف تكرار كل دقيقة حتى الفشل'},
  {id:'group-ab',icon:'⏱️',name:'Interval AMRAP',desc:'Multiple AMRAPs with rest',desc_ar:'جولات AMRAP مع راحة'},
  {id:'ygig-amrap',icon:'🔁',name:'YGIG — AMRAP',desc:'Partners swap full rounds',desc_ar:'تناوب جولات AMRAP مع الشريك',teamOnly:true},
  {id:'ygig-ft',icon:'🔀',name:'YGIG — For Time',desc:'Partners swap rounds, race time',desc_ar:'تناوب جولات للوقت مع الشريك',teamOnly:true}];
function step3(){
  var sel=S.wodTypes;
  app.innerHTML=dots(3)+'<div class="qc ani"><div class="ql">'+t('step4')+'</div><div class="qt" style="margin-bottom:16px">'+t('step4q')+'</div><div class="og">'
  +TYPES.map(function(tp){
    var dis=tp.teamOnly&&S.teamSize<2;
    var tpDesc=dis?t('team_only'):(CFG.lang==='ar'&&tp.desc_ar?tp.desc_ar:tp.desc);
    return'<button class="ob'+(sel.indexOf(tp.id)>=0?' sel':'')+' '+(dis?'dis':'')+'" onclick="'+(dis?'':'toggleType(\''+tp.id+'\')')+'"><span class="oi">'+tp.icon+'</span><span class="on">'+tp.name+'</span>'+(tpDesc?'<span class="od">'+tpDesc+'</span>':'')+'</button>';
  }).join('')+'</div><button class="nb" onclick="go()" '+(sel.length===0?'disabled':'')+'>'+t('generate')+'</button>'
  +bkBtn('back_te',2)+'</div>';
}
function toggleType(id){var i=S.wodTypes.indexOf(id);if(i===-1)S.wodTypes.push(id);else S.wodTypes.splice(i,1);step3()}
function go(){if(S.wodTypes.length===0)return;S.wod=null;S.step=4;render()}
function step4(){
  app.innerHTML=dots(4)+'<div class="loading"><div class="spinner"></div><div class="lt">'+t('generating')+'</div></div>';
  setTimeout(function(){
    var _tryGen=function(n){try{if(!S.wod){S.wod=generate(S);S.wodName=todayStr();}renderWod();}catch(e){console.error('WOD err #'+n,e);if(n<3){S.wod=null;setTimeout(function(){_tryGen(n+1);},200);}else{app.innerHTML=dots(4)+'<div style="text-align:center;padding:32px 16px"><div style="font-size:14px;color:var(--or);font-weight:700;margin-bottom:8px">خطأ في التوليد</div><div style="font-size:12px;color:var(--txt2);word-break:break-all;margin-bottom:16px">'+String(e)+'</div><button class="nb" onclick="S.step=3;render()">رجوع</button></div>';}}};
    _tryGen(1);

function getRoundRep(detail,r){
  // Standard format: "21 - 15 - 9 reps" / "21 - 15 - 9 s"
  var m=detail.match(/^([\d][\d\s\-]+?)\s*(reps.*|Cal.*|m$|s$|kg.*)$/);
  if(m){
    var nums=m[1].split('-').map(function(s){return s.trim();}).filter(function(s){return/^\d+$/.test(s);});
    return(r<nums.length?nums[r]:nums[nums.length-1])+' '+m[2].trim();
  }
  // Embedded-unit format: "21s - 15s - 9s" or "25m - 25m - 25m"
  var m2=detail.match(/^(\d+[a-zA-Z]+)(\s*-\s*\d+[a-zA-Z]+)*$/);
  if(m2){
    var parts=detail.split(/\s*-\s*/);
    return r<parts.length?parts[r].trim():parts[parts.length-1].trim();
  }
  return detail;
}
function setRoundRep(detail,r,newVal){
  var m=detail.match(/^([\d][\d\s\-]+?)\s*(reps.*|Cal.*|m$|kg.*|s$|each side)$/);
  if(!m){var parts=detail.split(' ');var u=parts.slice(1).join(' ')||'reps';return newVal+' '+u;}
  var nums=m[1].split('-').map(function(s){return s.trim();}).filter(function(s){return/^\d+$/.test(s);});
  while(nums.length<=r)nums.push(nums[nums.length-1]||'10');
  nums[r]=String(newVal);
  return nums.join(' - ')+' '+m[2].trim();
}

function fmtDetail(d){

  var emTag=it.emomMin?'<span style="background:var(--og);color:var(--or);font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:5px">'+it.emomMin+'</span>':'';
  if(it.isFixed)emTag+='<span style="background:#e8f5e9;color:#2e7d32;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:5px">Fixed</span>';
  var _secIt=(S.wod&&S.wod.sections&&S.wod.sections[si]&&S.wod.sections[si].items)||[];
  var _secType=S.wod&&S.wod.sections&&S.wod.sections[si]&&S.wod.sections[si].type;
  var _actN2=_secIt.filter(function(it2,i){return it2.kind==='str'&&i!==ii&&it2.ex;}).map(function(it2){return it2.ex.name;});
  var _chipperBan=(_secType==='Chipper'||_secType==='Ladder')?STR.filter(function(e){return e.unit==='time'||e.unit==='carry'||(_secType==='Ladder'&&(e.unit==='dist'||e.unit==='hold'));}).map(function(e){return e.name;}):[];
  var _dbCatFilter=null;
  if(_secType==='Death By'){var _dbC=S.wod.sections[si].deathByCfg;if(_dbC&&_dbC.cat&&_dbC.cat!=='all')_dbCatFilter=_dbC.cat;}
  var _tsUnitBan=S.teamSize===2?STR.filter(function(e){return e.unit==='time'||e.unit==='carry'||e.unit==='m';}).map(function(e){return e.name;}):[];
  var _altF=(ex.alts||[]).filter(function(a){
    if(_actN2.indexOf(a)>=0||_chipperBan.indexOf(a)>=0)return false;
    if(S.teamSize===2&&_tsUnitBan.indexOf(a)>=0)return false;
    if(_secType==='Death By'){var _ae=STR.filter(function(e){return e.name===a;})[0];if(!_ae||_ae.unit==='time'||_ae.unit==='carry'||_ae.unit==='m')return false;if(_dbCatFilter&&(!_ae||_ae.cat!==_dbCatFilter))return false;}
    if(_secType==='Tabata'){if(TABATA_STR_NAMES.indexOf(a)<0)return false;}
    return true;
  }).slice(0,4);
  var _reo=S._reorder;
  var _isSrc=_reo&&_reo.si===si&&_reo.ii===ii;
  var _isTgt=_reo&&_reo.si===si&&!_isSrc;
  var _enCls='en'+(_isSrc?' reo-src':(_isTgt?' reo-tgt':''));
  var _enLabel=_isSrc?'☰':num;
  var _enClick='onclick="'+(_isSrc?'cancelReorder()':(_isTgt?'doReorder('+si+','+ii+')':'startReorder('+si+','+ii+')'))+'"';
  return'<div class="er" id="ex-'+si+'-'+ii+'"><div class="'+_enCls+'" '+_enClick+'>'+_enLabel+'</div><div class="eb"><div class="ename" style="display:flex;align-items:center;gap:3px">'+ex.name+emTag+'<svg width="14" height="14" viewBox="0 0 24 24" data-name="'+ex.name.replace(/"/g,"&quot;")+'" onclick="openExerciseVideo(this.dataset.name)" style="cursor:pointer;flex-shrink:0" title="Watch on YouTube" fill="none"><path d="M8 5L19 12L8 19V5Z" fill="var(--or)"/></svg></div>'+(_secType==='Tabata'?'':(it.noEdit?'<div class="edet" style="display:inline-flex;align-items:center;gap:4px">'+fmtDetail(it.detail)+'</div>':'<span style="font-size:14px;color:var(--or);font-weight:700">'+fmtDetail(it.detail)+'</span>'+(it.noPencil?'':'<button onclick="openEditDetail('+si+','+ii+(roundIdx!==undefined?','+roundIdx:'')+')" style="background:none;border:none;padding:0 0 0 3px;font-size:11px;cursor:pointer;line-height:1;vertical-align:middle">&#x270F;&#xFE0F;</button>')))+'</div><div class="ea"><button class="esb" onclick="toggleSwap(\''+si+'\',\''+ii+'\')">'+t('swap')+'</button><button class="esb re" onclick="regenEx('+si+','+ii+',\'str\')">'+t('new_ex')+'</button></div></div>'
  +'<div class="sp" id="sp-'+si+'-'+ii+'"><div class="sh" style="display:flex;align-items:center;justify-content:space-between">'+t('similar')+'<button onclick="toggleSwap(\''+si+'\',\''+ii+'\')" style="background:none;border:none;cursor:pointer;font-size:16px;color:#2ECC71;line-height:1;padding:0;margin-left:8px">✕</button></div><div class="so">'
  +_altF.map(function(a){return'<div class="soi" onclick="swapStr('+si+','+ii+',\''+a.replace(/'/g,"\\'")+'\')">'+'<span class="sn">'+a+'</span><span class="stag">→ '+t('use')+'</span></div>'}).join('')
  +'</div><button class="gn" onclick="regenEx('+si+','+ii+',\'str\')">'+t('gen_diff')+'</button>'
  +'<div style="margin-top:10px;border-top:0.5px solid var(--bdr2);padding-top:10px">'
  +'<div style="font-size:10px;color:#2ECC71;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">'+t('manual')+'</div>'
  +'<div style="position:relative">'
  +'<input id="mn-'+si+'-'+ii+'" placeholder="'+(CFG.lang==='ar'?'اسم التمرين':'Exercise name')+'" oninput="swapAC(this,\'str\',\''+si+'-'+ii+'\')" autocomplete="off" style="width:100%;background:var(--bg2);border:0.5px solid var(--bdr);border-radius:8px;padding:8px 10px;color:var(--txt);font-size:12px;margin-bottom:5px;outline:none">'
  +'<div id="sac-'+si+'-'+ii+'" style="position:absolute;left:0;right:0;top:36px;background:var(--bg3);border:0.5px solid var(--bdr);border-radius:8px;overflow:hidden;z-index:10"></div>'
  +'</div>'
  +'<input id="md-'+si+'-'+ii+'" placeholder="'+(CFG.lang==='ar'?'تكرار / مسافة / زمن':'Reps / distance / time')+'" style="width:100%;background:var(--bg2);border:0.5px solid var(--bdr);border-radius:8px;padding:8px 10px;color:var(--txt);font-size:12px;margin-bottom:7px;outline:none">'
  +'<button onclick="manualSwap(\''+si+'\',\''+ii+'\')" style="width:100%;background:#2ECC71;border:1px solid #2ECC71;border-radius:8px;padding:8px;font-size:12px;color:#000;font-weight:700;cursor:pointer">'+t('use')+'</button>'
  +'</div></div>';
}
function renderCardio(it,si,ii,roundIdx){
  var ex=it.ex;
  var emTag=it.emomMin?'<span style="background:var(--cag);color:var(--ca);font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:5px">'+it.emomMin+'</span>':'';
  // Top: exercise name only
  var _ytIcon='<svg width="14" height="14" viewBox="0 0 24 24" data-name="'+ex.name.replace(/"/g,"&quot;")+'" onclick="openExerciseVideo(this.dataset.name)" style="cursor:pointer;vertical-align:middle;margin-left:3px;flex-shrink:0" title="Watch on YouTube" fill="none"><path d="M8 5L19 12L8 19V5Z" fill="var(--ca)"/></svg>';
  var nameOnly=ex.name+emTag+_ytIcon;
  // Bottom: amount+unit
  var amountHtml;
  var _sec=S.wod.sections[si];
  var _realItem=_sec&&_sec.items[ii];
  if(!it.singleRound&&it.kind!=='buyin'&&ex.amount!=null&&_sec&&_sec.scheme&&_sec.scheme.length){
    if(!_realItem.cardioAmounts)_realItem.cardioAmounts=new Array(_sec.scheme.length).fill(ex.amount);
    if(roundIdx!==undefined){
      // LONG FORM: single round editable
      var _amt=_realItem.cardioAmounts[roundIdx]!=null?_realItem.cardioAmounts[roundIdx]:ex.amount;
      amountHtml='<span style="display:inline-flex;align-items:center;gap:4px">'
        +'<span style="font-size:14px;color:var(--ca);font-weight:700">'+_amt+' '+ex.unit+'</span>'
        +'<button onclick="openEditCardioRound('+si+','+ii+','+roundIdx+')" style="background:none;border:none;padding:0 0 0 3px;font-size:11px;cursor:pointer;line-height:1;vertical-align:middle">&#x270F;&#xFE0F;</button>'
        +'</span>';
    }else{
      // SHORT FORM: combined amounts in one button (same value → show once)
      var _cAmts=_realItem.cardioAmounts;
      var _combined=(_cAmts.length>1&&_cAmts.every(function(v){return v===_cAmts[0];}))?String(_cAmts[0]):_cAmts.join(' - ');
      amountHtml='<span style="display:inline-flex;align-items:center;gap:4px">'
        +'<span style="font-size:14px;color:var(--ca);font-weight:700">'+_combined+' '+ex.unit+'</span>'
        +'<button onclick="openCardioSchemeEdit('+si+','+ii+')" style="background:none;border:none;padding:0 0 0 3px;font-size:11px;cursor:pointer;line-height:1;vertical-align:middle">&#x270F;&#xFE0F;</button>'
        +'</span>';
    }
  }else if(ex.amount!=null){
    amountHtml='<span style="display:inline-flex;align-items:center;gap:4px"><span style="font-size:14px;color:var(--ca);font-weight:700">'+ex.amount+' '+ex.unit+'</span><button onclick="openEditCardioName('+si+','+ii+')" style="background:none;border:none;padding:0 0 0 3px;font-size:11px;cursor:pointer;line-height:1;vertical-align:middle">&#x270F;&#xFE0F;</button></span>';
  }else{
    amountHtml='<span style="font-size:14px;color:var(--ca);font-weight:700">'+(dispDetail(it.detail)||'Cardio')+'</span>';
  }
  // تاباتا: بدون وحدات — اسم الحركة فقط (طلب Laila)
  if(S.wod&&S.wod.sections&&S.wod.sections[si]&&S.wod.sections[si].type==='Tabata')amountHtml='';
  var regenBtn='<button class="csb" onclick="regenEx(\''+si+'\',\''+ii+'\',\'cardio\')">'+t('new_ex')+'</button>';
  return'<div class="cb" id="ex-'+si+'-'+ii+'"><div class="ci">'+cico(ex.name)+'</div><div class="cbb"><div class="cn">'+nameOnly+'</div><div class="cd">'+amountHtml+'</div></div>'+regenBtn+'<button class="csb" onclick="toggleSwap(\''+si+'\',\''+ii+'\')">'+t('swap').replace(' ↕','')+'</button></div>'
  +'<div class="sp cp" id="sp-'+si+'-'+ii+'"><div class="sh ch" style="display:flex;align-items:center;justify-content:space-between">'+t('cardio_alts')+'<button onclick="toggleSwap(\''+si+'\',\''+ii+'\')" style="background:none;border:none;cursor:pointer;font-size:16px;color:var(--ca);opacity:0.6;line-height:1;padding:0;margin-left:8px">✕</button></div><div class="so">'
  +(ex.alts||[]).map(function(a){return'<div class="soi co" onclick="swapCardio('+si+','+ii+',\''+a.replace(/'/g,"\\'")+'\')">'+'<span class="sn">'+a+'</span><span class="stag">→ '+t('use')+'</span></div>'}).join('')
  +'</div><button class="gn" style="color:var(--ca);border-color:rgba(0,188,212,.3);background:rgba(0,188,212,.05)" onclick="regenEx('+si+','+ii+',\'cardio\')">'+t('diff_c')+'</button>'
  +'<div style="margin-top:10px;border-top:0.5px solid rgba(0,188,212,.15);padding-top:10px">'
  +'<div style="font-size:10px;color:var(--ca);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">'+t('manual')+'</div>'
  +'<div style="position:relative">'
  +'<input id="cmn-'+si+'-'+ii+'" placeholder="'+(CFG.lang==='ar'?'مثال: جري':'e.g. Run')+'" oninput="swapAC(this,\'cardio\',\''+si+'-'+ii+'\')" autocomplete="off" style="width:100%;background:var(--bg2);border:0.5px solid rgba(0,188,212,.3);border-radius:8px;padding:8px 10px;color:var(--txt);font-size:12px;margin-bottom:7px;outline:none">'
  +'<div id="csac-'+si+'-'+ii+'" style="position:absolute;left:0;right:0;top:36px;background:var(--bg3);border:0.5px solid rgba(0,188,212,.3);border-radius:8px;overflow:hidden;z-index:10"></div>'
  +'</div>'
  +'<button onclick="manualSwapCardio(\''+si+'\',\''+ii+'\')" style="width:100%;background:var(--ca);border:1px solid var(--ca);border-radius:8px;padding:8px;font-size:12px;color:#000;font-weight:700;cursor:pointer">'+t('use')+'</button>'
  +'</div></div>';
}

function openCardioSchemeEdit(si,ii){
  var item=S.wod&&S.wod.sections[si]&&S.wod.sections[si].items[ii];
  if(!item)return;
  var sec=S.wod.sections[si];
  if(!item.cardioAmounts)item.cardioAmounts=new Array(sec.scheme.length).fill(item.ex.amount||0);
  cardioEditUnit=item.ex.unit||'m';
  editingDetail={si:si,ii:ii,cardioScheme:true};
  var _sec2=S.wod.sections[si];
  // Open expanded (per-round) by default for Ladder OR whenever the rounds already carry different values —
  // otherwise the collapsed single-box editor would silently flatten an existing per-round customization on Save.
  var _hasVariedRounds=item.cardioAmounts.length>1&&!item.cardioAmounts.every(function(v){return v===item.cardioAmounts[0];});
  _edCardioExpanded=!!(_sec2&&_sec2.type==='Ladder')||_hasVariedRounds;
  _renderCardioSchemeSheet(item);
}
function _renderCardioSchemeSheet(item){
  var sheet=document.getElementById('edit-sheet');
  var presets=[10,20,50,100,200,400,1000];
  var unitCol='<div style="display:flex;flex-direction:column;gap:6px">'
    +['m','Cal','reps','min','s'].map(function(u){var s=u===cardioEditUnit;
      return'<bu'+'tton onclick="switchCardioUnitScheme(\''+u+'\')" style="background:'+(s?'rgba(0,188,212,0.15)':'var(--bg3)')+';border:1.5px solid '+(s?'var(--ca)':'var(--bdr)')+';border-radius:7px;padding:5px 10px;font-size:11px;color:'+(s?'var(--ca)':'var(--txt2)')+';cursor:pointer;font-weight:700;min-height:28px">'+u+'</bu'+'tton>';
    }).join('')+'</div>';
  var n=item.cardioAmounts.length;
  var inputArea;
  var _cardioVal=item.cardioAmounts[0]||item.ex.amount||0;
  if(n>1){
    var _cToggleLbl='<div onclick="toggleCardioExpand()" style="font-size:9px;color:var(--txt3);font-weight:700;cursor:pointer;padding:2px 8px;border-radius:5px;border:1px dashed var(--bdr);margin-bottom:4px;display:inline-block">R × '+n+(_edCardioExpanded?' ▴':' ▾')+'</div>';
    if(_edCardioExpanded){
      inputArea='<div style="display:flex;flex-direction:column;align-items:center;gap:4px">'
        +_cToggleLbl
        +'<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">'
        +item.cardioAmounts.map(function(v,i){return'<div style="display:flex;flex-direction:column;align-items:center;gap:2px">'
          +'<div style="font-size:8px;color:var(--txt3);font-weight:600">R'+(i+1)+'</div>'
          +'<input id="car-r-'+i+'" type="number" value="'+v+'" inputmode="numeric" min="1" max="9999"'
          +' onfocus="lastFocusedInput=this.id" style="width:50px;background:var(--bg3);border:1.5px solid var(--ca);border-radius:8px;padding:6px 2px;font-size:14px;font-weight:900;color:var(--ca);text-align:center;outline:none">'
          +'</div>';}).join('')
        +'</div></div>';
    }else{
      inputArea='<div style="display:flex;flex-direction:column;align-items:center;gap:2px">'
        +_cToggleLbl
        +'<input id="car-r-0" type="number" value="'+_cardioVal+'" inputmode="numeric" min="1" max="9999"'
        +' onfocus="lastFocusedInput=this.id" style="width:72px;background:var(--bg3);border:2px solid var(--ca);border-radius:9px;padding:8px 2px;font-size:16px;font-weight:900;color:var(--ca);text-align:center;outline:none">'
        +'</div>';
    }
  }else{
    inputArea='<input id="car-r-0" type="number" value="'+_cardioVal+'" inputmode="numeric" min="1" max="9999"'
      +' onfocus="lastFocusedInput=this.id" style="width:72px;background:var(--bg3);border:2px solid var(--ca);border-radius:9px;padding:8px 2px;font-size:16px;font-weight:900;color:var(--ca);text-align:center;outline:none">';
  }
  var inputWrapper=(n>1&&_edCardioExpanded)
    ?'<div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:14px"><div style="flex:1">'+inputArea+'</div>'+unitCol+'</div>'
    :'<div style="display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:14px">'+inputArea+unitCol+'</div>';
  sheet.innerHTML=
    '<div style="width:32px;height:3px;background:var(--bdr);border-radius:2px;margin:0 auto 14px"></div>'
    +'<div style="text-align:right;margin-bottom:4px"><span style="font-size:10px;color:var(--ca);font-weight:700;letter-spacing:1px">'+t('edit_amt')+' ✏️</span></div>'
    +'<div style="text-align:right;font-size:14px;color:var(--txt);margin-bottom:14px;font-weight:700">'+item.ex.name+'</div>'
    +inputWrapper
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px">'
    +presets.map(function(p){return'<bu'+'tton onpointerdown="event.preventDefault()" onclick="setEditNum('+p+')" style="background:rgba(0,188,212,0.1);border:2px solid rgba(0,188,212,0.55);border-radius:9px;padding:6px 10px;font-size:11px;color:var(--ca);cursor:pointer;font-weight:700;min-height:32px">'+p+'</bu'+'tton>';}).join('')
    +'</div>'
    +'<div style="display:flex;gap:8px">'
    +'<bu'+'tton onclick="closeEditDetail()" style="flex:1;background:var(--bg3);border:0.5px solid var(--bdr);border-radius:12px;padding:13px;font-size:14px;color:var(--txt2);cursor:pointer;font-weight:600;min-height:48px">'+t('cancel')+'</bu'+'tton>'
    +'<bu'+'tton onclick="saveEditDetail()" style="flex:2;background:var(--ca);border:none;border-radius:12px;padding:13px;font-size:15px;color:#000;cursor:pointer;font-weight:700;min-height:48px">'+t('save')+'</bu'+'tton>'
    +'</div>';
  var ov=document.getElementById('edit-overlay');
  ov.style.display='block';
  setTimeout(function(){document.getElementById('edit-sheet').style.transform='translateX(-50%) translateY(0)';},10);
}
function toggleCardioExpand(){
  var ed=editingDetail;if(!ed||!ed.cardioScheme)return;
  var item=S.wod.sections[ed.si].items[ed.ii];
  if(_edCardioExpanded){
    var rds=item.cardioAmounts.map(function(v,i){var inp=document.getElementById('car-r-'+i);return inp?parseInt(inp.value,10)||v:v;});
    item.cardioAmounts=rds;_edCardioExpanded=false;
    _renderCardioSchemeSheet(item);
    setTimeout(function(){var inp=document.getElementById('car-r-0');if(inp){inp.focus();inp.select();}},30);
  }else{
    _edCardioExpanded=true;
    _renderCardioSchemeSheet(item);
    setTimeout(function(){var inp0=document.getElementById('car-r-0');if(inp0)inp0.focus();},30);
  }
}
function switchCardioUnitScheme(u){
  cardioEditUnit=u;
  var ed=editingDetail;
  var item=S.wod.sections[ed.si].items[ed.ii];
  if(_edCardioExpanded){
    var rds=item.cardioAmounts.map(function(v,i){var inp=document.getElementById('car-r-'+i);return inp?parseInt(inp.value,10)||v:v;});
    item.cardioAmounts=rds;
  }else{
    var _sc0=document.getElementById('car-r-0');
    var _sv=_sc0?parseInt(_sc0.value,10):NaN;
    if(!isNaN(_sv)&&_sv>=1)item.cardioAmounts=item.cardioAmounts.map(function(){return _sv;});
  }
  _renderCardioSchemeSheet(item);
}
function openEditCardioRound(si,ii,r){
  var item=S.wod&&S.wod.sections[si]&&S.wod.sections[si].items[ii];
  if(!item)return;
  if(!item.cardioAmounts){
    var sec=S.wod.sections[si];
    item.cardioAmounts=new Array(sec.scheme?sec.scheme.length:1).fill(item.ex.amount||0);
  }
  cardioEditUnit=item.ex.unit||'m';
  var cur=item.cardioAmounts[r]!=null?item.cardioAmounts[r]:item.ex.amount;
  editingDetail={si:si,ii:ii,cardioRound:r};
  _renderCardioRoundSheet(item.ex.name,cur,r);
}
function _renderCardioRoundSheet(name,cur,r){
  var presets=[10,20,50,100,200,400,1000];
  var unitCol=['m','Cal','reps','min','s'].map(function(u){var s=u===cardioEditUnit;
    return'<bu'+'tton onclick="switchCardioUnitRound(\''+u+'\','+r+')" style="background:'+(s?'rgba(0,188,212,0.15)':'var(--bg3)')+';border:1.5px solid '+(s?'var(--ca)':'var(--bdr)')+';border-radius:7px;padding:5px 10px;font-size:11px;color:'+(s?'var(--ca)':'var(--txt2)')+';cursor:pointer;font-weight:700;min-height:28px">'+u+'</bu'+'tton>';
  }).join('');
  var sheet=document.getElementById('edit-sheet');
  sheet.innerHTML=
    '<div style="width:32px;height:3px;background:var(--bdr);border-radius:2px;margin:0 auto 14px"></div>'
    +'<div style="text-align:right;margin-bottom:4px"><span style="font-size:10px;color:var(--ca);font-weight:700;letter-spacing:1px">'+t('edit_amt')+' ✏️</span></div>'
    +'<div style="text-align:right;font-size:14px;color:var(--txt);margin-bottom:14px;font-weight:700">'+name+' — Round '+(r+1)+'</div>'
    +'<div style="display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:14px">'
    +'<input id="ed-num" type="number" value="'+cur+'" inputmode="numeric" min="1" max="9999"'
    +' onfocus="lastFocusedInput=this.id" style="width:72px;background:var(--bg3);border:2px solid var(--ca);border-radius:9px;padding:8px 2px;font-size:16px;font-weight:900;color:var(--ca);text-align:center;outline:none">'
    +'<div style="display:flex;flex-direction:column;gap:6px">'+unitCol+'</div>'
    +'</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px">'
    +presets.map(function(p){return'<bu'+'tton onpointerdown="event.preventDefault()" onclick="setEditNum('+p+')" style="background:rgba(0,188,212,0.1);border:2px solid rgba(0,188,212,0.55);border-radius:9px;padding:6px 10px;font-size:11px;color:var(--ca);cursor:pointer;font-weight:700;min-height:32px">'+p+'</bu'+'tton>';}).join('')
    +'</div>'

var _tabTimer={iv:null,seq:[],idx:0,rem:0,paused:false};
var _audioCtx=null;
var _audioReady=false;
function _unlockAudio(){
  if(_audioReady)return;
  if(!_audioCtx){try{_audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}}
  // silent buffer — فك قفل iOS القديم
  try{
    var buf=_audioCtx.createBuffer(1,1,22050);
    var src=_audioCtx.createBufferSource();
    src.buffer=buf;src.connect(_audioCtx.destination);src.start(0);
  }catch(e){}
  var p=_audioCtx.state==='suspended'?_audioCtx.resume():Promise.resolve();
  p.then(function(){_audioReady=true;}).catch(function(){});
}
// فك القفل عند أي تفاعل — iOS + Android
['touchstart','touchend','mousedown','keydown'].forEach(function(ev){
  document.addEventListener(ev,_unlockAudio,{once:false,passive:true});
});
function _getAudioCtx(){
  if(!_audioCtx){try{_audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(_audioCtx.state==='suspended'){_audioCtx.resume().catch(function(){});}
  return _audioCtx;
}
function _tabBeep(freq,dur,vol){
  var ctx=_getAudioCtx();if(!ctx)return;
  try{var o=ctx.createOscillator();var g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;g.gain.setValueAtTime(vol||0.5,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+(dur||0.1));o.start(ctx.currentTime);o.stop(ctx.currentTime+(dur||0.1));}catch(e){}
}

function showTabataTimer(si){
  var sec=S.wod.sections[si];
  var cfg=sec.tabataCfg||{};
  var _mode=cfg.mode||cfg._genMode||'single';
  var movs=sec.items.filter(function(it){return it.kind==='str'||it.kind==='cardio';});
  var seq=[];
  // GET READY
  seq.push({phase:'ready',dur:10,label:'GET READY',sub:'',mov:'',intv:0,tot:0});
  if(_mode==='single'){
    var nm=movs[0]?(movs[0].ex&&movs[0].ex.name)||'':'' ;
    for(var i=1;i<=8;i++){
      seq.push({phase:'work',dur:20,label:'WORK',sub:'Interval '+i+' / 8',mov:nm,intv:i,tot:8});
      seq.push({phase:'rest',dur:10,label:'REST',sub:'Interval '+i+' / 8',mov:nm,intv:i,tot:8});
    }
  }else if(_mode==='multi'){
    var n=movs.length;
    for(var m=0;m<n;m++){
      var nm=movs[m]?(movs[m].ex&&movs[m].ex.name)||'':'';
      var nmNext=m+1<n?(movs[m+1].ex&&movs[m+1].ex.name)||'':'';
      for(var i=1;i<=8;i++){
        seq.push({phase:'work',dur:20,label:'WORK',sub:'Interval '+i+' / 8',mov:nm,intv:i,tot:8});
        seq.push({phase:'rest',dur:10,label:'REST',sub:'Interval '+i+' / 8',mov:nm,intv:i,tot:8});
      }
      if(m<n-1)seq.push({phase:'between',dur:60,label:'REST',sub:'1 MIN — Next: '+nmNext,mov:'',intv:0,tot:0});
    }
  }else{ // alternating اليديد: سيتات — كل سيت تمرينان بالتناوب 8 فترات (4 جولات لكل تمرين) + راحة دقيقة بين السيتات
    var nSets=Math.max(1,Math.floor(movs.length/2));
    for(var s2=0;s2<nSets;s2++){
      var _mA=movs[s2*2]?(movs[s2*2].ex&&movs[s2*2].ex.name)||'':'';
      var _mB=movs[s2*2+1]?(movs[s2*2+1].ex&&movs[s2*2+1].ex.name)||'':_mA;
      for(var i2=1;i2<=8;i2++){
        var _mv=(i2%2===1)?_mA:_mB;
        var _rd=Math.ceil(i2/2);
        seq.push({phase:'work',dur:20,label:'WORK',sub:'Set '+(s2+1)+' / '+nSets+' · Round '+_rd+' / 4',mov:_mv,intv:i2,tot:8});

// ─── WOD TIMER DISPATCHER ────────────────────────────────────────────────────
function showWodTimer(type,si){
  if(type==='Tabata'){showTabataTimer(si);return;}
  // Countdown types
  if(type==='AMRAP'||type==='Interval 1'){showAmrapTimer(si);return;}
  // YGIG: RFT if iv.r && iv.cap, else AMRAP
  if(type==='YGIG / Partner WOD'){
    var _iv=S.wod.sections[si].infoVars||{};
    if(_iv.r&&_iv.cap){showRftTimer(si);return;}else{showAmrapTimer(si);return;}
  }
  // Count-up types
  if(type==='For Time / RFT'||type==='Chipper'||type==='Buy-In / Cash-Out'){showRftTimer(si);return;}
  // EMOM
  if(type==='EMOM'){showEmomTimer(si);return;}
  // Countdown from cap
  if(type==='Ladder'||type==='Death By'){showCapTimer(si);return;}
}

var _wodTimer={iv:null,paused:false,elapsed:0,totalSec:0,type:'',curMin:1,totalMin:0,minSec:0,movs:[],finished:false};
function _wodBeep(freq,dur,vol){var ctx=_getAudioCtx();if(!ctx)return;try{var o=ctx.createOscillator();var g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;g.gain.setValueAtTime(vol||0.5,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+(dur||0.1));o.start(ctx.currentTime);o.stop(ctx.currentTime+(dur||0.1));}catch(e){}}
function _wodBeepStart(){_wodBeep(880,0.12);setTimeout(function(){_wodBeep(880,0.12);},130);}
function _wodBeepCountdown(){_wodBeep(660,0.08);}
function _wodBeepDone(){_wodBeep(660,0.15);setTimeout(function(){_wodBeep(880,0.15);},200);setTimeout(function(){_wodBeep(1100,0.4);},400);}
function _fmtClock(sec){var m=Math.floor(sec/60),s=sec%60;return(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}

function showAmrapTimer(si){
  var sec=S.wod.sections[si];
  var _rawMin=(S.wod.cfg.time||20);
  var _gabNtm=1;if(sec.type==='Interval 1'){for(var _gti=si+1;S.wod.sections[_gti]&&S.wod.sections[_gti].type==='Interval 2';_gti++)_gabNtm++;}
  var totalMin=(sec.type==='Interval 1')?Math.floor(_rawMin/_gabNtm)*_gabNtm:_rawMin;
  var label=(sec.type==='Interval 1'?'Interval AMRAP':sec.type==='YGIG / Partner WOD'?'YGIG AMRAP':'AMRAP');
  var _gabRestSec=(sec.type==='Interval 1')?(function(){var _bm=Math.floor(_rawMin/_gabNtm);return(_bm<=7?1:_bm>=15?3:2)*60;})():0;
  _wodTimer={iv:null,paused:false,elapsed:0,totalSec:totalMin*60,type:'amrap',curMin:0,totalMin:totalMin,minSec:0,movs:[],finished:false,label:label,si:si,gabRestSec:_gabRestSec,restIv:null,restRemSec:0,restDone:false,gabN:_gabNtm,breaksDone:0};
  _unlockAudio();_wodBeepStart();
  var ov=document.createElement('div');ov.id='wod-timer-ov';ov.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;font-family:inherit;overflow:hidden;direction:ltr;';ov.dir='ltr';
  document.body.appendChild(ov);_lockBodyScroll();_wodTimerRender();
  _wodTimer.iv=setInterval(function(){
    if(_wodTimer.paused)return;
    _wodTimer.elapsed++;
    var rem=_wodTimer.totalSec-_wodTimer.elapsed;
    if(rem<=0){_wodBeepDone();_wodTimer.finished=true;_wodTimerRender();clearInterval(_wodTimer.iv);_wodTimer.iv=null;return;}
    if(_wodTimer.label==='Interval AMRAP'&&(function(){var _n=_wodTimer.gabN||2;for(var _b=1;_b<_n;_b++){if(_wodTimer.elapsed===Math.floor(_wodTimer.totalSec*_b/_n)&&_wodTimer.breaksDone<_b)return true;}return false;})()){_wodTimer.breaksDone=(_wodTimer.breaksDone||0)+1;
      _wodBeep(880,0.15);setTimeout(function(){_wodBeep(880,0.15);},200);setTimeout(function(){_wodBeep(1100,0.4);},400);
      _wodTimer.paused=true;_wodTimer.halfAlert=true;_wodTimer.restRemSec=_wodTimer.gabRestSec;_wodTimer.restDone=false;
      _wodTimer.restIv=setInterval(function(){
        _wodTimer.restRemSec--;
        if(_wodTimer.restRemSec<=3&&_wodTimer.restRemSec>0)_wodBeepCountdown();
        if(_wodTimer.restRemSec<=0){clearInterval(_wodTimer.restIv);_wodTimer.restIv=null;_wodTimer.restDone=true;_wodTimer.halfAlert=false;_wodTimer.halfDone=true;_wodTimer.paused=false;_wodBeepStart();}
        _wodTimerRender();

    }

  },1000);
}

function setBuyInVal(si,key,val,btn){
  var sec=S.wod.sections[si];if(!sec.buyInCfg)sec.buyInCfg={};

  Array.from(parent.children).forEach(function(b){b.style.background='var(--bg2)';b.style.borderColor='var(--bdr)';b.style.color='var(--txt2)';});
  if(sec.buyInCfg[key]===val){delete sec.buyInCfg[key];return;}
  sec.buyInCfg[key]=val;btn.style.background='var(--or)';btn.style.borderColor='var(--or)';btn.style.color='#000';
}
function regenBuyIn(si){
  var sec=S.wod.sections[si];var cfg=sec.buyInCfg||{};
  // لا تضيف stickyRep لو المستخدم قفّل rounds (يعطّل _rftAuto ويكسر حساب الجولات)
  var _sr=_stickyRep(sec,S.level,S.teamSize);
  if(_sr&&!cfg.baseReps&&!cfg.rounds)cfg=Object.assign({},cfg,{baseReps:_sr});
  var newSecs=_regenBest(mkBuyInOut,S.wod.cfg.time,S.level,S.teamSize,cfg);if(!newSecs)return;
  // Hard-lock: فرض عدد الجولات لو المستخدم حدده
  if(cfg.rounds&&newSecs[0]){
    var _s0=newSecs[0];
    if(_s0.scheme){var _lr=_s0.scheme[_s0.scheme.length-1]||10;while(_s0.scheme.length<cfg.rounds)_s0.scheme.push(_lr);if(_s0.scheme.length>cfg.rounds)_s0.scheme=_s0.scheme.slice(0,cfg.rounds);}
    if(_s0.infoVars)_s0.infoVars.r=cfg.rounds;
    var _sepIt=_s0.items&&_s0.items.find(function(x){return x.kind==='sep'&&x.label&&x.label.indexOf('ROUNDS')>=0;});
    if(_sepIt)_sepIt.label='── '+cfg.rounds+' ROUNDS ──';
  }
  newSecs[0].buyInCfg=cfg;S.wod.sections[si]=newSecs[0];
  var el=document.getElementById('sec-'+si);if(el)el.outerHTML=renderSec(S.wod.sections[si],si);_updateTabataChip(si);
}
function randomBuyIn(si){
  if(!S.cfgStore)S.cfgStore={};S.cfgStore['buy-in-cashout']={};
  var newSecs=_regenBest(mkBuyInOut,S.wod.cfg.time,S.level,S.teamSize,{});
  if(!newSecs)return;
  newSecs[0].buyInCfg={};S.wod.sections[si]=newSecs[0];
  var el=document.getElementById('sec-'+si);if(el)el.outerHTML=renderSec(S.wod.sections[si],si);_updateTabataChip(si);
}

function _rebuildGroupAb(si,cfg,forceN){
  // يبني n فترات (2/3) ويستبدل السكشنات الحالية — سولو وتيم نفس الشي (التيم 2 تيم سبلت)
  var _n=forceN||(cfg.intervals===3?3:cfg.intervals===2?2:(function(){var c=1;for(var i=si+1;S.wod.sections[i]&&S.wod.sections[i].type==='Interval 2';i++)c++;return c;})());
  var blockTime=_n===2?Math.floor(S.wod.cfg.time/2):Math.floor(S.wod.cfg.time/_n);
  var _mkA=function(t,lv,tm,c){return mkAmrap(t,lv,tm,c);};
  var _letters=['A','B','C'];var _used=[];var newSecs=[];
  var _aCardio=null;var _aStrIts=[];
  for(var _k=0;_k<_n;_k++){
    var _kCfg=_k===0?cfg:Object.assign({},cfg,{excludedNames:_used.slice(),withCardio:!!_aCardio});
    if(_k>0&&_aCardio&&_aCardio.ex&&_aCardio.ex.amount!=null)_kCfg.cardioAmt=_aCardio.ex.amount;
    var _sk=(_regenBest(_mkA,blockTime,S.level,S.teamSize,_kCfg)||[mkAmrap(blockTime,S.level,S.teamSize,_kCfg)[0]])[0];
    if(_k===0){_gabFit2(_sk,S.level,S.teamSize,blockTime,cfg);_gabSchemeFill(_sk,S.level,S.teamSize,blockTime,cfg,_used);_aCardio=_sk.items?_sk.items.filter(function(it){return it.kind==='cardio';})[0]:null;_aStrIts=_sk.items?_sk.items.filter(function(it){return it.kind==='str';}):[];}
    else{
    // مطابقة الصعوبة مع A: تكرارات A المفروضة لازم تظل منطقية — أي حركة أثقل/أخف بكثير تنستبدل بمقاربة
    (function(){
      var _kStrIts=_sk.items.filter(function(it){return it.kind==='str';});
      var _kLocal=_used.slice();_kStrIts.forEach(function(it){if(it.ex)_kLocal.push(it.ex.name);});
      _kStrIts.forEach(function(it,ix){
        var _aIt=_aStrIts[ix];if(!_aIt||!it.ex)return;
        var _aSpr=getSecondsPerRep(_aIt.ex,S.level,1,false);
        var _kSpr=getSecondsPerRep(it.ex,S.level,1,false);
        if(_kSpr>_aSpr*1.5||_kSpr<_aSpr*0.6){
          var _cand=getPool(S.level,null,1).filter(function(e){
            if(_kLocal.indexOf(e.name)>=0)return false;
            if(['time','carry','m','dist','hold'].indexOf(e.unit)>=0&&['time','carry','m','dist','hold'].indexOf(_aIt.ex.unit)<0)return false;
            var s2=getSecondsPerRep(e,S.level,1,false);
            return s2<=_aSpr*1.25&&s2>=_aSpr*0.8;
          });
          if(_cand.length){var _pe=pk(_cand);it.ex=_pe;it.detail=getDetail(_pe,it.baseRep,null,S.level,1);_kLocal.push(_pe.name);}
        }
      });
    })();

    // إصلاح مطابقة الكارديو: نفس الوحدة إجباري (100m ما تصير 100Cal!)
    if(_aCardio&&_aCardio.ex){
      var _kC=_sk.items.filter(function(it){return it.kind==='cardio';})[0];
      if(_kC&&_kC.ex){
        if(_kC.ex.unit!==_aCardio.ex.unit){
          var _uPool=CARDIO.filter(function(c){return !c.altOnly&&c.unit===_aCardio.ex.unit&&c.name!==_aCardio.ex.name;});
          var _uPick=_uPool.length?pk(_uPool):null;
          _kC.ex=Object.assign({},(_uPick||_aCardio.ex),{amount:_aCardio.ex.amount,unit:_aCardio.ex.unit});

function switchStrUnit(u){
  strEditUnit=u;
  var ed=editingDetail;
  var item=S.wod.sections[ed.si].items[ed.ii];
  if(ed.multiRound){
    var rds;
    if(_edRoundsExpanded){rds=ed.rounds.map(function(v,i){var inp=document.getElementById('ed-r-'+i);return inp?parseInt(inp.value,10)||v:v;});}
    else{var _cv=parseInt((document.getElementById('ed-num')||{}).value||ed.rounds[0],10)||ed.rounds[0];rds=ed.rounds.map(function(){return _cv;});}
    ed.rounds=rds;
    _renderEditDetailSheet(item.ex.name,rds[0],t('edit_reps'),null,null,false,rds);
    setTimeout(function(){
      if(_edRoundsExpanded){var inp0=document.getElementById('ed-r-0');if(inp0)inp0.focus();}
      else{var inpN=document.getElementById('ed-num');if(inpN){inpN.focus();inpN.select();}}
    },30);
  }else{
    var cur=parseInt((document.getElementById('ed-num')||{}).value||'10',10)||10;
    _renderEditDetailSheet(item.ex.name,cur,t('edit_reps'),null,null,false,null);
    setTimeout(function(){var inp=document.getElementById('ed-num');if(inp){inp.focus();inp.select();}},30);
  }
}
function setEditNum(n){
  // Use last focused input
  if(lastFocusedInput){
    var t=document.getElementById(lastFocusedInput);
    if(t){t.value=n;t.focus();return;}
  }
  var inp=document.getElementById('ed-num');
  if(inp){inp.value=n;return;}
  var r0=document.getElementById('ed-r-0');
  if(r0)r0.value=n;
}
function toggleEditRoundsExpand(){
  var ed=editingDetail;if(!ed||!ed.multiRound)return;
  var item=S.wod.sections[ed.si].items[ed.ii];
  if(_edRoundsExpanded){
    var rds=ed.rounds.map(function(v,i){var inp=document.getElementById('ed-r-'+i);return inp?parseInt(inp.value,10)||v:v;});
    ed.rounds=rds;_edRoundsExpanded=false;
    _renderEditDetailSheet(item.ex.name,rds[0],t('edit_reps'),null,null,false,rds);
    setTimeout(function(){var inp=document.getElementById('ed-num');if(inp){inp.focus();inp.select();}},30);
  }else{
    _edRoundsExpanded=true;
    _renderEditDetailSheet(item.ex.name,ed.rounds[0],t('edit_reps'),null,null,false,ed.rounds);
    setTimeout(function(){var inp0=document.getElementById('ed-r-0');if(inp0){inp0.focus();}},30);
  }
}
function closeEditDetail(){lastFocusedInput=null;_edRoundsExpanded=false;_edCardioExpanded=false;
  var sheet=document.getElementById('edit-sheet');
  var ov=document.getElementById('edit-overlay');
  sheet.style.transform='translateX(-50%) translateY(100%)';
  setTimeout(function(){ov.style.display='none';},250);
  editingDetail=null;
}
function saveEditDetail(){
  var ed=editingDetail;
  // Multi-round strength (short form)
  if(ed&&ed.multiRound){
    var _item=S.wod.sections[ed.si].items[ed.ii];
    var _vals,_rv;
    if(_edRoundsExpanded){
      _vals=ed.rounds.map(function(v,i){var inp=document.getElementById('ed-r-'+i);return inp?parseInt(inp.value,10)||v:v;});
      if(_vals.some(function(v){return isNaN(v)||v<1;}))return toast('Enter a valid number','#ff6600');
      _rv=_vals[0];
    }else{
      var _inp=document.getElementById('ed-num');
      _rv=_inp?parseInt(_inp.value,10):NaN;
      if(isNaN(_rv)||_rv<1)return toast('Enter a valid number','#ff6600');
      _vals=new Array(ed.roundCount).fill(_rv);
    }
    var _uSuffix=strEditUnit==='m'?' m':strEditUnit==='s'?' s':' reps';
    var _detail=_vals.join(' - ')+_uSuffix;
    S.wod.sections[ed.si].items[ed.ii]=Object.assign({},_item,{detail:_detail,detailEdited:true,savedUnit:strEditUnit,baseRep:_rv,repsPerRound:_vals,_userRep:true});
    closeEditDetail();reRenderSec(ed.si);toast('✅ Updated!');
    return;
  }
  // Cardio scheme (all rounds at once)
  if(ed.cardioScheme){
    var _item=S.wod.sections[ed.si].items[ed.ii];
    var _cVals;
    if(_edCardioExpanded){
      _cVals=_item.cardioAmounts.map(function(v,i){var inp=document.getElementById('car-r-'+i);return inp?parseInt(inp.value,10)||v:v;});
      if(_cVals.some(function(v){return isNaN(v)||v<1;}))return toast('Enter a valid number','#ff6600');
    }else{
      var _cinp=document.getElementById('car-r-0');
      var _cv=_cinp?parseInt(_cinp.value,10):NaN;
      if(isNaN(_cv)||_cv<1)return toast('Enter a valid number','#ff6600');
      _cVals=_item.cardioAmounts.map(function(){return _cv;});
    }
    _item.cardioAmounts=_cVals;
    _item.ex=Object.assign({},_item.ex,{amount:_cVals[0],unit:cardioEditUnit});
    _item._userCardio=true;
    closeEditDetail();
    reRenderSec(ed.si);
    toast('✅ Updated!');
    return;
  }
  var inp=document.getElementById('ed-num');
  if(!inp)return;
  var val=parseInt(inp.value,10);
  if(isNaN(val)||val<1)return toast('Enter a valid number','#ff6600');
  // Cardio per-round
  if(ed.cardioRound!==undefined){
    var _item=S.wod.sections[ed.si].items[ed.ii];
    if(!_item.cardioAmounts){
      var _sec=S.wod.sections[ed.si];
      _item.cardioAmounts=new Array(_sec.scheme?_sec.scheme.length:1).fill(_item.ex.amount||0);
    }
    _item.cardioAmounts[ed.cardioRound]=val;
    _item.ex=Object.assign({},_item.ex,{amount:val}); // sync ex.amount for _secChip
    _item._userCardio=true;
    closeEditDetail();
    reRenderSec(ed.si);
    toast('✅ Updated!');
    return;
  }
  // Strength per-round (long form)
  if(ed.roundIdx!==undefined){
    var _item=S.wod.sections[ed.si].items[ed.ii];
    var _newDetail=setRoundRep(_item.detail,ed.roundIdx,val);
    var _drm2=_newDetail.match(/^([\d][\d\s\-]+?)\s*(reps|m|s)\b/);
    var _newNums=_drm2?_drm2[1].split('-').map(function(s){return parseInt(s.trim(),10);}).filter(function(v){return!isNaN(v);}):(_newDetail.match(/\d+/g)||[]).map(Number);
    var _avgR=_newNums.length?Math.round(_newNums.reduce(function(s,v){return s+v;},0)/_newNums.length):val;
    S.wod.sections[ed.si].items[ed.ii]=Object.assign({},_item,{detail:_newDetail,detailEdited:true,savedUnit:strEditUnit,baseRep:_avgR,_userRep:true,repsPerRound:_newNums.length>1?_newNums:_item.repsPerRound});
    closeEditDetail();
    reRenderSec(ed.si);
    toast('✅ Updated!');
    return;
  }
  var item=S.wod.sections[ed.si].items[ed.ii];
  var unit=ed.unit;
  var setMatch=item.detail.match(/×\s*\d+\s*sets?/);
  var setSuffix=setMatch?' '+setMatch[0]:'';
  var newDetail;
  if(unit==='side') newDetail=val+' reps each side';
  else if(strEditUnit==='m') newDetail=val+' m'+setSuffix;
  else if(strEditUnit==='s') newDetail=val+' s'+setSuffix;
  else newDetail=val+(setSuffix?' reps '+setSuffix.trim():' reps');
  // If original detail was multi-round format, replicate new value for all rounds
  var _om=item.detail.match(/^([\d][\d\s\-]+?)\s*(reps|m|s)\b/);
  if(_om){
    var _op=_om[1].split('-').map(function(s){return s.trim();}).filter(function(s){return/^\d+$/.test(s);});
    if(_op.length>1){
      var _u2=strEditUnit==='m'?' m':strEditUnit==='s'?' s':' reps';
      newDetail=new Array(_op.length).fill(val).join(' - ')+_u2;
    }
  }
  // Preserve (Fixed) suffix if original had it
  if(item.detail.indexOf('(Fixed)')>=0&&newDetail.indexOf('(Fixed)')<0)newDetail=newDetail+' (Fixed)';
  S.wod.sections[ed.si].items[ed.ii]=Object.assign({},item,{detail:newDetail,detailEdited:true,baseRep:val,_userRep:true});
  closeEditDetail();
  reRenderSec(ed.si);
  toast('✅ Updated!');
}

function tryCode(){
  var emailInp=document.getElementById('gate-email');
  var inp=document.getElementById('gate-inp');
  var email=(emailInp&&emailInp.value.trim().toLowerCase())||'';
  var val=(inp&&inp.value.trim().toUpperCase())||'';
  if(!email||!val)return;
  var btn=document.querySelector('button[onclick="tryCode()"]');
  if(btn){btn.disabled=true;btn.textContent=t('checking');}
  verifyCode(email,val,function(ok){
    if(btn){btn.disabled=false;btn.textContent=t('enter');}
    if(!ok){
      if(inp)inp.style.borderColor='var(--re)';
      if(emailInp)emailInp.style.borderColor='var(--re)';
      toast(t('invalid'),'#ff1744');
      setTimeout(function(){if(inp)inp.style.borderColor='var(--bdr)';if(emailInp)emailInp.style.borderColor='var(--bdr)';},1500);
      return;
    }
    localStorage.setItem(AUTH_KEY,JSON.stringify({email:email,password:val}));
    inp.style.borderColor='var(--gr)';
    render();
  });
}
// ── عدّاد زوّار الترايل: يسجّل كل جهاز جديد يفتح صفحة الترايل مرة واحدة في Supabase ──
function logTrialVisit(){
  try{
    if(typeof TRIAL==='undefined'||!TRIAL)return;              // صفحة الترايل فقط
    var K='wod_trial_vid';
    if(localStorage.getItem(K))return;                          // هذا الجهاز محسوب مسبقاً
    var vid='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
    localStorage.setItem(K,vid);
    fetch(SUPABASE_URL+'/rest/v1/trial_visits',{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({id:vid,user_agent:(navigator.userAgent||'').slice(0,180)})
    }).catch(function(){});
  }catch(e){}
}

// ─── My WODs (Saved WODs) ────────────────────────────────────────────────────
var _SW_MAX=30;
var _SW_KEY='cft_saved_v1';
var _SW_editId=null; // null=new · id=updating existing

function _swLoad(){try{return JSON.parse(localStorage.getItem(_SW_KEY)||'[]');}catch(e){return[];}}
function _swStore(arr){try{localStorage.setItem(_SW_KEY,JSON.stringify(arr));}catch(e){toast('⚠️ Storage error','#ff4444');}}
function _swCount(){return _swLoad().length;}
function _swUpdateBadge(){var n=document.getElementById('sw-badge-num');if(n)n.textContent=_swCount();var lbl=document.getElementById('sw-title-lbl');if(lbl)lbl.textContent=CFG.lang==='ar'?'المحفوظات':'My WODs';}
function _swDeepCopy(obj){try{return JSON.parse(JSON.stringify(obj));}catch(e){return obj;}}

function _swExPreview(snap){
  if(!snap||!snap.wod||!snap.wod.sections)return'';
  var names=[];
  snap.wod.sections.forEach(function(sec){sec.items.forEach(function(it){if(it.ex&&it.ex.name&&names.indexOf(it.ex.name)<0&&names.length<4)names.push(it.ex.name);});});
  return names.join(', ')+(names.length===4?'…':'');
}
function _swFmtDate(){var d=new Date();return d.getDate()+' '+['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()]+' '+d.getFullYear();}

function _swDoSave(){
  if(!S||!S.wod){toast('No WOD to save','#ff6600');return;}
  var snap;
  try{
    var _wodClean={type:S.wod.type,sections:S.wod.sections};
    snap=JSON.parse(JSON.stringify({wod:_wodClean,level:S.level,time:S.time,teamSize:S.teamSize,wodName:S.wodName}));
  }catch(e){toast('⚠️ Save error: '+e.message,'#ff4444');return;}
  if(_SW_editId!==null){
    var saved=_swLoad();
    for(var i=0;i<saved.length;i++){
      if(saved[i].id===_SW_editId){
        saved[i].snap=snap;
        try{localStorage.setItem(_SW_KEY,JSON.stringify(saved));toast(CFG.lang==='ar'?'💾 تم التحديث!':'💾 Updated!','#22c55e');_swUpdateBadge();}
        catch(e2){toast('⚠️ '+e2.message,'#ff4444');}
        return;
      }
    }
    toast('⚠️ Not found','#ff6600');return;
  }
  var saved2=_swLoad();
  if(saved2.length>=_SW_MAX){toast(CFG.lang==='ar'?'تم الوصول للحد الأقصى — يرجى حذف تمرين محفوظ قبل إضافة تمرين جديد.':'Maximum limit reached — please delete a saved WOD before adding a new one.','#ff6600',4500);return;}
  saved2.unshift({id:Date.now(),dateSaved:_swFmtDate(),customName:null,snap:snap});
  try{localStorage.setItem(_SW_KEY,JSON.stringify(saved2));toast(CFG.lang==='ar'?'💾 تم الحفظ!':'💾 Saved!','#22c55e');_swUpdateBadge();}
  catch(e3){toast('⚠️ '+e3.message,'#ff4444');}
}

function _swDoDelete(id){
  if(!confirm(CFG.lang==='ar'?'تحذف هذا الـ WOD؟':'Delete this WOD?'))return;
  _swStore(_swLoad().filter(function(w){return w.id!==id;}));
  _swUpdateBadge();showMyWODs();
}

function _swDoRename(id){
  var saved=_swLoad(),entry=null;
  for(var i=0;i<saved.length;i++){if(saved[i].id===id){entry=saved[i];break;}}
  if(!entry)return;
  var nm=prompt(CFG.lang==='ar'?'اسم الـ WOD:':'WOD name:',entry.customName||entry.dateSaved);
  if(nm===null)return;
  entry.customName=nm.trim()||null;
  _swStore(saved);showMyWODs();
}

function _swLoadEntry(id,resetEdit){
  var saved=_swLoad(),entry=null;
  for(var i=0;i<saved.length;i++){if(saved[i].id===id){entry=saved[i];break;}}
  if(!entry||!entry.snap)return;
  // فتح تمرين محفوظ = ياخذ تاريخ اليوم ويطلع فوق القائمة (بدون ما ياكل خانة جديدة من الحد الأقصى)
  var _swToday=_swFmtDate();
  if(entry.dateSaved!==_swToday){
    entry.dateSaved=_swToday;
    var _swReord=saved.filter(function(w){return w.id!==entry.id;});
    _swReord.unshift(entry);
    _swStore(_swReord);
  }
  var snap=_swDeepCopy(entry.snap);
  // ترحيل الأسماء القديمة بالمحفوظات: Group A/B → Interval 1/2
  if(snap.wod&&snap.wod.sections)snap.wod.sections.forEach(function(_ms){if(_ms&&_ms.type==='Group A')_ms.type='Interval 1';if(_ms&&_ms.type==='Group B')_ms.type='Interval 2';});
  S.wod=snap.wod;S.level=snap.level;S.time=snap.time;S.teamSize=snap.teamSize||1;S.wodName=snap.wodName||'';
  if(S.wod&&!S.wod.cfg)S.wod.cfg=S;
  S.step=4;
  _SW_editId=resetEdit?null:id;
  _swCloseMyWODs();renderWod();
}

function _swCloseMyWODs(){var ov=document.getElementById('sw-overlay');if(ov)ov.remove();}

function showMyWODs(){
  closeCfg();
  var saved=_swLoad();
  var ov=document.getElementById('sw-overlay');
  if(!ov){ov=document.createElement('div');ov.id='sw-overlay';document.body.appendChild(ov);}
  ov.style.cssText='position:fixed;inset:0;z-index:8000;background:var(--bg);overflow-y:auto;font-family:inherit;-webkit-overflow-scrolling:touch;';
  var ar=CFG.lang==='ar';
  var cards='';
  if(!saved.length){
    cards='<div style="text-align:center;padding:60px 20px;color:var(--txt3)">'
      +'<div style="font-size:44px;margin-bottom:14px">💾</div>'
      +'<div style="font-size:16px;font-weight:700;color:var(--txt2)">'+(ar?'لا يوجد WODs محفوظة':'No saved WODs yet')+'</div>'
      +'<div style="font-size:13px;margin-top:8px">'+(ar?'اضغط 💾 حفظ بعد ما تولد WOD':'Tap 💾 Save after generating a WOD')+'</div>'
      +'</div>';
  } else {
    saved.forEach(function(entry){
      var title=entry.customName||entry.dateSaved;
      var snap=entry.snap||{};
      var wod=snap.wod||{};
      var lv={'beginner':'Beginner','intermediate':'Intermediate','advanced':'Advanced','elite':'Elite'}[snap.level]||snap.level||'';
      var tm=snap.time||'';
      var team=snap.teamSize||1;
      var type=TL[wod.type]||(wod.sections&&wod.sections[0]&&(TL[wod.sections[0].type]||wod.sections[0].type))||'WOD';
      var preview=_swExPreview(snap);
      var isSaving=(_SW_editId===entry.id);
      cards+='<div style="background:var(--bg2);border:0.5px solid '+(isSaving?'#22c55e':'var(--bdr)')+';border-radius:14px;padding:14px 16px;margin:0 0 12px;cursor:pointer" onclick="_swLoadEntry('+entry.id+',false)">'
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">'
        +'<span style="font-weight:800;font-size:15px;color:var(--txt)">'+title+(isSaving?' ✏️':'')+'</span>'
        +'<span style="display:flex;gap:6px" onclick="event.stopPropagation()">'
        +'<button onclick="_swDoRename('+entry.id+')" style="background:none;border:none;font-size:18px;cursor:pointer;padding:2px 5px;line-height:1">✏️</button>'
        +'<button onclick="_swDoDelete('+entry.id+')" style="background:none;border:none;font-size:18px;cursor:pointer;padding:2px 5px;line-height:1">🗑️</button>'
        +'</span></div>'
        +'<div style="font-size:12px;color:var(--txt3);margin-bottom:'+(preview?'5':'10')+'px">'+type+' · '+lv+' · '+tm+' min'+(team>1?' · Team '+team:'')+'</div>'
        +(preview?'<div style="font-size:12px;color:var(--txt2);margin-bottom:10px;line-height:1.5">'+preview+'</div>':'')
        +'<div onclick="event.stopPropagation()">'
        +'<button onclick="_swLoadEntry('+entry.id+',true)" style="width:100%;background:rgba(255,102,0,0.10);border:1px solid rgba(255,102,0,0.35);border-radius:10px;padding:9px;font-size:14px;font-weight:700;color:var(--or);cursor:pointer">▶ '+(ar?'ابدأ':'Start')+'</button>'
        +'</div></div>';
    });
  }
  ov.innerHTML='<div style="max-width:480px;margin:0 auto;padding:16px 16px 40px">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-top:env(safe-area-inset-top,8px)">'
    +'<button onclick="_swCloseMyWODs()" style="background:none;border:none;font-size:24px;cursor:pointer;color:var(--txt);padding:4px 8px;line-height:1">←</button>'
    +'<span style="font-size:17px;font-weight:800;color:var(--txt)">💾 '+(ar?'المحفوظات':'My WODs')+'</span>'
    +'<span style="font-size:13px;color:var(--txt3);font-weight:600">'+saved.length+'/'+_SW_MAX+'</span>'
    +'</div>'
    +cards+'</div>';
}

</script>
